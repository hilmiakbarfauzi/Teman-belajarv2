<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peringkat Quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/peringkat.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom Animations -->
    <link rel='stylesheet' href='../assets/css/animations.css'>
</head>

<body>
    <!-- Navbar (Generated by navbar.js) -->
    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/alert.js"></script>

    <div class="peringkat-container">
        <h2>🏆 Leaderboard Top Siswa</h2>

        <!-- Podium Section (Juara 1-3) -->
        <div id="podium-area" class="podium-section">
            <div class="nice-loader">
                <i class="fas fa-circle-notch"></i>
                <p>Memuat Peringkat...</p>
            </div>
        </div>

        <!-- List Section (Peringkat 4 dst) -->
        <div id="ranking-list" class="ranking-list">
            <!-- Akan diisi JS -->
        </div>

        <div id="no-data" class="no-data" style="display: none;">
            <i class="fa-solid fa-trophy" style="font-size: 40px; margin-bottom: 30px; color: #cbd5e0;"></i>
            <p>Belum ada data peringkat. Jadilah yang pertama!</p>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <!-- Kiri: Kembali ke Kelas -->
            <a href="kelas.html" style="text-decoration: none;">
                <button class="refresh-btn btn-secondary" style="margin: 0;">
                    <i class="fa-solid fa-arrow-left"></i> Kelas
                </button>
            </a>

            <!-- Kanan: Klaim Sertifikat -->
            <a href="sertifikat.html" style="text-decoration: none;">
                <button class="refresh-btn btn-gold" style="margin: 0;">
                    <i class="fa-solid fa-certificate"></i> Klaim Sertifikat
                </button>
            </a>
        </div>

        <!-- Refresh Button (Center) -->
        <button class="refresh-btn mt-20" onclick="loadLeaderboard(true)">
            <i class="fa-solid fa-rotate-right"></i> Refresh Peringkat
        </button>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // --- Konfigurasi Firebase ---
        // Pastikan konfigurasi ini sama dengan project anda
        const firebaseConfig = {
            apiKey: "AIzaSyBaFa2_d4almWd1wBlmPdzv9aGOa0e0m3A",
            authDomain: "daftarhadit-dfa3a.firebaseapp.com",
            projectId: "daftarhadit-dfa3a",
            storageBucket: "daftarhadit-dfa3a.firebasestorage.app",
            messagingSenderId: "438675023798",
            appId: "1:438675023798:web:3afc376cd435f0154fc317",
            measurementId: "G-XCNLPJSS57"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Initialize services
        const db = firebase.firestore();
        const auth = firebase.auth();

        async function loadLeaderboard(isManualRefresh = false) {
            const podiumArea = document.getElementById('podium-area');
            const rankingList = document.getElementById('ranking-list');
            const noData = document.getElementById('no-data');

            // Feedback jika refresh manual
            if (isManualRefresh) {
                Swal.fire({
                    title: 'Memperbarui...',
                    didOpen: () => Swal.showLoading(),
                    timer: 800,
                    showConfirmButton: false,
                    allowOutsideClick: false
                });
            }

            try {
                // Query Basic 
                const snapshot = await db.collection('quiz_results')
                    .orderBy('skor', 'desc')
                    .limit(50)
                    .get();

                const results = [];
                snapshot.forEach(doc => {
                    results.push(doc.data());
                });

                // Sorting manual (Skor lalu Nilai jika ada, sebagai fallback)
                results.sort((a, b) => {
                    if (b.skor !== a.skor) return b.skor - a.skor;
                    return (b.nilai || 0) - (a.nilai || 0);
                });

                podiumArea.innerHTML = '';
                rankingList.innerHTML = '';

                if (results.length === 0) {
                    podiumArea.style.display = 'none';
                    noData.style.display = 'block';
                    if (isManualRefresh) Swal.fire('Data Kosong', 'Belum ada data peringkat tersimpan.', 'info');
                    return;
                }

                podiumArea.style.display = 'grid'; // Pastikan display grid/flex sesuai CSS
                noData.style.display = 'none';

                // --- RENDER PODIUM (Top 3) ---
                const top3 = results.slice(0, 3);
                let podiumHTML = '';

                // Juara 2 (Posisi Kiri)
                if (top3[1]) {
                    podiumHTML += createPodiumCard(top3[1], 2, 'podium-2', 'silver');
                } else {
                    podiumHTML += '<div class="podium-card podium-2" style="opacity:0; visibility:hidden;"></div>';
                }

                // Juara 1 (Posisi Tengah)
                if (top3[0]) {
                    podiumHTML += createPodiumCard(top3[0], 1, 'podium-1', 'gold');
                }

                // Juara 3 (Posisi Kanan)
                if (top3[2]) {
                    podiumHTML += createPodiumCard(top3[2], 3, 'podium-3', '#cd7f32');
                } else {
                    podiumHTML += '<div class="podium-card podium-3" style="opacity:0; visibility:hidden;"></div>';
                }

                podiumArea.innerHTML = podiumHTML;

                // --- RENDER LIST (Peringkat 4 dst) ---
                const rest = results.slice(3);

                // Reset display list
                rankingList.style.display = rest.length > 0 ? 'block' : 'none';

                rest.forEach((result, index) => {
                    const realRank = index + 4;
                    const initials = (result.nama || '?').charAt(0).toUpperCase();

                    const itemHTML = `
                        <div class="rank-item">
                            <div class="rank-number">#${realRank}</div>
                            <div class="avatar-circle" style="width: 40px; height: 40px; font-size: 16px; margin: 0 15px 0 0; background: #edf2f7; color: #2d3748; display:flex; align-items:center; justify-content:center; border-radius:50%; font-weight:bold;">${initials}</div>
                            <div class="rank-info">
                                <div class="rank-name">${result.nama}</div>
                                <div class="rank-class">${result.kelas || 'Umum'}</div>
                            </div>
                            <div class="rank-score-container">
                                <div class="rank-score">${result.nilai || result.skor}</div>
                                <div class="rank-date">Skor</div>
                            </div>
                        </div>
                    `;
                    rankingList.innerHTML += itemHTML;
                });

                // Munculkan dengan Animasi
                podiumArea.classList.add('fade-in-content');
                rankingList.classList.add('fade-in-list');

            } catch (error) {
                console.error("Error loading leaderboard:", error);

                podiumArea.innerHTML = ''; // Clear loaders
                const noData = document.getElementById('no-data');
                noData.style.display = 'block';
                noData.innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; margin-bottom: 20px; color: #e53e3e;"></i>
                    <p style="color: #e53e3e;">Gagal memuat data. Periksa koneksi internet Anda.</p>
                `;

                Swal.fire({
                    icon: 'error',
                    title: 'Gagal Memuat',
                    text: 'Terjadi kesalahan koneksi saat mengambil data peringkat.'
                });
            }
        }

        function createPodiumCard(data, rank, cssClass, iconColor) {
            const initials = (data.nama || '?').charAt(0).toUpperCase();
            const crownHTML = rank === 1 ? '<div class="crown"><i class="fa-solid fa-crown"></i></div>' : '';

            let medaliIcon = '';
            if (rank === 1) medaliIcon = 'fa-medal';
            if (rank === 2) medaliIcon = 'fa-medal';
            if (rank === 3) medaliIcon = 'fa-award';

            return `
                <div class="podium-card ${cssClass}">
                    ${crownHTML}
                    <div class="avatar-circle">${initials}</div>
                    <div class="winner-name">${data.nama}</div>
                    <div class="winner-score">
                        ${data.nilai || data.skor} <span style="font-size:0.7em; opacity:0.8;">pts</span>
                    </div>
                    <div style="font-size: 12px; color: #888; margin-top: 5px;">${data.kelas || '-'}</div>
                    <div style="margin-top: auto; color: ${iconColor}; font-size: 24px;">
                        <i class="fa-solid ${medaliIcon}"></i>
                    </div>
                </div>
            `;
        }

        // Expose Refresh ke global
        window.loadLeaderboard = loadLeaderboard;

        // Auth Logic
        auth.onAuthStateChanged(user => {
            const authLink = document.getElementById('nav-auth-link');
            if (user) {
                if (authLink) {
                    authLink.textContent = "Logout";
                    authLink.href = "#";
                    authLink.onclick = (e) => {
                        e.preventDefault();
                        auth.signOut().then(() => {
                            localStorage.removeItem('isLoggedIn');
                            window.location.href = "home.html";
                        });
                    };
                }
                // LOAD DATA
                loadLeaderboard();
            } else {
                // Jika tidak login
                // Show Alert and Redirect
                if (typeof showAlert === 'function') {
                    showAlert("Akses Dibatasi", "Anda harus login untuk melihat peringkat.", "../index.html");
                } else {
                    alert("Akses Dibatasi. Silakan login.");
                    window.location.href = "../index.html";
                }
            }
        });
    </script>
</body>

</html>
