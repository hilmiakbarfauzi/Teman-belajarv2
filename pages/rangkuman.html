<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rangkuman Materi | Teman Belajar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/materi.css">
    <link rel='stylesheet' href='../assets/css/animations.css'>
</head>

<body>

    <script src="../assets/js/navbar.js"></script>

    <!-- Hero Section -->
    <div class="materi-hero hero-rangkuman fade-in-up">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="badge-materi">RANGKUMAN</span>
            <h1>Rangkuman Materi</h1>
            <p>Intisari lengkap dari seluruh indikator pembelajaran Keamanan Data.</p>
        </div>
    </div>

    <div class="learning-container">

        <!-- Dynamic Summary Container -->
        <!-- Content will be loaded from indikator*.html by js/rangkuman-loader.js -->
        <div id="summary-container"></div>

        <!-- Video Rangkuman (Static) -->
        <article class="learning-card fade-in-up delay-2">
            <div class="card-header">
                <i class="fa-solid fa-play-circle"></i>
                <h2>Video Rangkuman</h2>
            </div>
            <div class="card-body">
                <p class="mb-4">Tonton video ringkasan berikut untuk memperkuat pemahaman Anda.</p>

                <div class="h5p-wrapper">
                    <!-- PASTE LINK H5P/YOUTUBE DI SINI -->
                    <iframe src="https://app.lumi.education/api/v1/run/6oDRKJ/embed" width="100%" height="720"
                        frameborder="0" allowfullscreen="allowfullscreen"
                        allow="geolocation *; microphone *; camera *; midi *; encrypted-media *"></iframe>
                    <script src="https://app.Lumi.education/api/v1/h5p/core/js/h5p-resizer.js" charset="UTF-8"></script>
                </div>
            </div>
        </article>

        <!-- Completion / CTA Section -->
        <div class="completion-section fade-in-up delay-3">
            <div class="completion-box">
                <i class="fa-solid fa-graduation-cap completion-icon"></i>
                <div>
                    <h3>Pembelajaran Selesai!</h3>
                    <p>Anda telah mempelajari dan meninjau kembali seluruh materi.</p>
                </div>
                <a href="quiz-evaluasi.html" class="btn-quiz">
                    <i class="fa-solid fa-clipboard-question"></i>
                    <span>Evaluasi Akhir</span>
                </a>
            </div>
        </div>

    </div>

    <script src="../assets/js/rangkuman-loader.js"></script>
</body>

</html>
